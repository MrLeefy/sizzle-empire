<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="skyBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#7CE0FF"/>
      <stop offset="55%" stop-color="#5CC8FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="warmMedallion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="toqueFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="72%" stop-color="#FFFBF0"/>
      <stop offset="100%" stop-color="#FDE6B8"/>
    </linearGradient>
    <linearGradient id="ribbonCoral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="goldStar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="45%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Bright sunny sky full-bleed maskable app tile -->
  <rect x="0" y="0" width="512" height="512" rx="0" fill="url(#skyBg)"/>
  <!-- Top specular tile gloss -->
  <path d="M92 34 H420 C454 34 476 58 476 92 C400 132 112 132 36 92 C36 58 58 34 92 34 Z" fill="#FFFFFF" opacity="0.28"/>

  <!-- Warm golden medallion inside 80% maskable safe zone -->
  <circle cx="256" cy="264" r="174" fill="url(#warmMedallion)" stroke="#3D2314" stroke-width="14"/>
  <path d="M126 196 C158 124 230 98 310 112 C230 120 166 154 126 196 Z" fill="#FFFFFF" opacity="0.42"/>

  <!-- Chunky glossy cartoon chef toque with #3D2314 outline -->
  <path
    d="M168 278 C118 268 108 202 156 180 C166 118 228 96 256 118 C284 96 346 118 356 180 C404 202 394 268 344 278 Z"
    fill="url(#toqueFill)"
    stroke="#3D2314"
    stroke-width="15"
    stroke-linejoin="round"
  />
  <!-- Soft caramel toque pleats -->
  <path d="M214 252 C210 218 216 188 228 168" fill="none" stroke="#D9B88C" stroke-width="9" stroke-linecap="round"/>
  <path d="M256 250 V162" fill="none" stroke="#D9B88C" stroke-width="9" stroke-linecap="round"/>
  <path d="M298 252 C302 218 296 188 284 168" fill="none" stroke="#D9B88C" stroke-width="9" stroke-linecap="round"/>
  <!-- Top-left glossy shine on chef puff -->
  <ellipse cx="196" cy="158" rx="28" ry="13" transform="rotate(-26 196 158)" fill="#FFFFFF" opacity="0.88"/>

  <!-- Chunky chef hat band + coral accent stripe -->
  <rect x="164" y="268" width="184" height="62" rx="18" fill="#FFFBF0" stroke="#3D2314" stroke-width="14"/>
  <rect x="171" y="302" width="170" height="21" rx="8" fill="url(#ribbonCoral)"/>
  <line x1="172" y1="302" x2="340" y2="302" stroke="#3D2314" stroke-width="7"/>

  <!-- Chunky outlined golden star emblem -->
  <path
    d="M256 326 L273 362 L313 367 L283 394 L291 434 L256 414 L221 434 L229 394 L199 367 L239 362 Z"
    fill="url(#goldStar)"
    stroke="#3D2314"
    stroke-width="12"
    stroke-linejoin="round"
  />
  <circle cx="246" cy="374" r="6" fill="#FFFFFF" opacity="0.9"/>

  <!-- Crisp cartoon sky sparkles -->
  <path d="M104 106 L112 126 L132 134 L112 142 L104 162 L96 142 L76 134 L96 126 Z" fill="#FFFFFF" stroke="#3D2314" stroke-width="6" stroke-linejoin="round"/>
  <path d="M408 118 L414 132 L428 138 L414 144 L408 158 L402 144 L388 138 L402 132 Z" fill="#FEF08A" stroke="#3D2314" stroke-width="6" stroke-linejoin="round"/>
</svg>
